name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not report security issues here.** Follow [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands or exact UI steps. Booleans matter here — be precise.
      placeholder: |
        1. Create an invoice for item X
        2. Change quantity to 0
        3. Observe error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which release/build are you using?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, deployment mode (on-prem / VM / cloud)
    validations:
      required: false